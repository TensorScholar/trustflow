name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
      - run: python -m pip install -e '.[dev,web]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/trustflow
      - run: python scripts/check_architecture.py
      - run: python scripts/security_scan.py
      - run: python scripts/secret_scan.py
      - run: python scripts/generate_schemas.py
      - run: git diff --exit-code -- schemas
      - run: pytest --cov=trustflow --cov-branch --cov-report=xml
      - run: trustflow demo
      - run: python -m pip_audit
